apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: sentientgate
data:
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: sentientgate
type: Opaque
stringData:
  SENTINEL_SECRET_KEY: "8f4c2a9d7e1b6f3a0c8d5e2f9a7b1c6d4e8f2a0b7c5d9e1f3a6c8b0d2e4f7a9"
  JWT_SECRET_KEY: "3b7e9a1c5f8d2a6e0b4c9f1d7e3a8b5c2f6d0e9a4b1c7f3d8a2e5b9c6f0d4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sentientgate
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: shrihari7396/api-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secret
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sentientgate
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: sentientgate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
