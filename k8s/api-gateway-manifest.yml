apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: sentientgate
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  EUREKA_URL: "http://eureka-server:8761/eureka"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: sentientgate
type: Opaque
stringData:
  SENTINEL_SECRET_KEY: "prod-sentinel-secret-key-placeholder"
  JWT_SECRET_KEY: "prod-jwt-secret-key-placeholder"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sentientgate
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: shrihari7396/api-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-secret
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sentientgate
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: sentientgate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
