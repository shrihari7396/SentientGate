apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sentientgate
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: shrihari7396/api-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: api-gateway-config
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sentientgate
spec:
  type: LoadBalancer
  ports:
    - port: 8079
      targetPort: 8080
  selector:
    app: api-gateway
