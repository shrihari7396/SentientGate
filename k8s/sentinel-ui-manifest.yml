apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-ui
  namespace: sentientgate
  labels:
    app: sentinel-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-ui
  template:
    metadata:
      labels:
        app: sentinel-ui
    spec:
      containers:
        - name: sentinel-ui
          image: shrihari7396/sentinel-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-ui
  namespace: sentientgate
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 80
  selector:
    app: sentinel-ui
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinel-ui-hpa
  namespace: sentientgate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinel-ui
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
