apiVersion: v1 # Specifies the Kubernetes API version for this resource
kind: ConfigMap # Declares the resource type as a ConfigMap for configuration data
metadata: # Contains metadata parameters for identifying the resource
  name: logging-config # Unique name of the ConfigMap in the namespace
data: # Holds the configuration key-value pairs as plain text strings
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/mydb" # Database connection URL string pointing to Postgres
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:29092" # Kafka broker internal service port connection details
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka" # Client Eureka service registry registration zone endpoint
  SERVER_PORT: "8080" # Listening network port for Logging Service HTTP requests
