apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: shrihari7396/mcp-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: GRPC_CLIENT_LOGGING_SERVICE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: GRPC_CLIENT_LOGGING_SERVICE_ADDRESS
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: SERVER_PORT
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mcp-server
