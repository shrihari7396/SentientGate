apiVersion: apps/v1 # Specifies the Kubernetes API version for Deployments
kind: Deployment # Declares the resource type as a Deployment
metadata: # Contains metadata parameters for identifying the resource
  name: mcp-server # Unique name of the Deployment in the namespace
  labels: # Metadata tags used for grouping and identifying the resource
    app: mcp-server # Label identifier for the application
spec: # Details the desired state and settings of the Deployment
  replicas: 2 # Specifies the number of concurrent Pod replicas to run (clustered setup)
  selector: # Defines how the Deployment finds the Pods it manages
    matchLabels: # Lists label matching requirements for the target Pods
      app: mcp-server # Match Pods containing the application label 'mcp-server'
  template: # Templates the specification of Pods to be created
    metadata: # Contains metadata parameters for the Pod template
      labels: # Metadata tags applied to the created Pods
        app: mcp-server # Label applied to Pods for grouping and selection
    spec: # Details the actual workload specification for the Pods
      containers: # Lists the containers running within the Pod
        - name: mcp-server # Logical name of the container
          image: shrihari7396/mcp-server:latest # Docker registry image path and version tag
          imagePullPolicy: IfNotPresent # Pull the image from registry only if it doesn't exist locally
          env: # Environment variables to inject into the container
            - name: SPRING_DATA_REDIS_HOST # Name of the environment variable for Redis connection
              valueFrom: # Specifies the source of the environment value
                configMapKeyRef: # References a key within a ConfigMap resource
                  name: mcp-server-config # Name of the ConfigMap source
                  key: SPRING_DATA_REDIS_HOST # Specific key containing the Redis host
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS # Name of the environment variable for Kafka endpoints
              valueFrom: # Specifies the source of the environment value
                configMapKeyRef: # References a key within a ConfigMap resource
                  name: mcp-server-config # Name of the ConfigMap source
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS # Specific key containing Kafka connection detail
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE # Name of the environment variable for Eureka registry URL
              valueFrom: # Specifies the source of the environment value
                configMapKeyRef: # References a key within a ConfigMap resource
                  name: mcp-server-config # Name of the ConfigMap source
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE # Specific key containing registry details
            - name: GRPC_CLIENT_LOGGING_SERVICE_ADDRESS # Name of the environment variable for gRPC Logging target
              valueFrom: # Specifies the source of the environment value
                configMapKeyRef: # References a key within a ConfigMap resource
                  name: mcp-server-config # Name of the ConfigMap source
                  key: GRPC_CLIENT_LOGGING_SERVICE_ADDRESS # Specific key containing the address details
            - name: SERVER_PORT # Name of the environment variable for container server port
              valueFrom: # Specifies the source of the environment value
                configMapKeyRef: # References a key within a ConfigMap resource
                  name: mcp-server-config # Name of the ConfigMap source
                  key: SERVER_PORT # Specific key containing the port number
          ports: # Ports exposed by the container
            - containerPort: 8080 # Port 8080 is exposed for HTTP REST API and gRPC traffic
---
apiVersion: v1 # Specifies the Kubernetes API version for Service resources
kind: Service # Declares the resource type as a Service for network load balancing
metadata: # Contains metadata parameters for identifying the resource
  name: mcp-server # Unique name of the Service, used as DNS host name
spec: # Details the network configuration for the Service
  ports: # Ports exposed and routed by the Service
    - port: 8080 # Port exposed on the cluster-internal network
      targetPort: 8080 # Container port where traffic is forwarded
  selector: # Determines the set of Pods targeted by this Service
    app: mcp-server # Route traffic to Pods matching the 'mcp-server' label
