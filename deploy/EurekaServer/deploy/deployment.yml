apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: sentientgate
  labels:
    app: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: shrihari7396/eureka-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: eureka-server-config
                  key: SPRING_PROFILES_ACTIVE
            - name: EUREKA_INSTANCE_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: eureka-server-config
                  key: EUREKA_INSTANCE_HOSTNAME
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: sentientgate
spec:
  ports:
    - port: 8761
      targetPort: 8761
  selector:
    app: eureka-server
