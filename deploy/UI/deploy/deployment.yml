apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-ui
  labels:
    app: sentinel-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-ui
  template:
    metadata:
      labels:
        app: sentinel-ui
    spec:
      containers:
        - name: sentinel-ui
          image: shrihari7396/sentinel-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-ui
spec:
  type: LoadBalancer
  ports:
    - port: 5173
      targetPort: 80
  selector:
    app: sentinel-ui
