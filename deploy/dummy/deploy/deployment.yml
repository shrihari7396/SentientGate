apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-service
  labels:
    app: dummy-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-service
  template:
    metadata:
      labels:
        app: dummy-service
    spec:
      containers:
        - name: dummy-service
          image: shrihari7396/dummy-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: dummy-service-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: dummy-service-config
                  key: SERVER_PORT
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-service
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: dummy-service
