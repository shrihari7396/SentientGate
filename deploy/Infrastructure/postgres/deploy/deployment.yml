apiVersion: apps/v1 # Specifies the Kubernetes API version for Deployments
kind: Deployment # Declares the resource type as a Deployment
metadata: # Contains metadata parameters for identifying the resource
  name: postgres # Unique name of the Deployment in the namespace
  labels: # Metadata tags used for grouping and identifying the resource
    app: postgres # Label identifier for the application
spec: # Details the desired state and settings of the Deployment
  replicas: 1 # Specifies the number of concurrent Pod replicas to run
  selector: # Defines how the Deployment finds the Pods it manages
    matchLabels: # Lists label matching requirements for the target Pods
      app: postgres # Match Pods containing the application label 'postgres'
  template: # Templates the specification of Pods to be created
    metadata: # Contains metadata parameters for the Pod template
      labels: # Metadata tags applied to the created Pods
        app: postgres # Label applied to Pods for grouping and selection
    spec: # Details the actual workload specification for the Pods
      containers: # Lists the containers running within the Pod
        - name: postgres # Logical name of the container
          image: postgres:16.2 # Docker registry image path and version tag
          env: # Environment variables to inject into the container
            - name: POSTGRES_DB # Name of the environment variable for database name
              valueFrom: # Specifies the source of the environment value
                configMapKeyRef: # References a key within a ConfigMap resource
                  name: postgres-config # Name of the ConfigMap source
                  key: POSTGRES_DB # Specific key containing the database name
            - name: POSTGRES_USER # Name of the environment variable for database username
              valueFrom: # Specifies the source of the environment value
                secretKeyRef: # References a key within a Secret resource
                  name: postgres-secret # Name of the Secret source
                  key: POSTGRES_USER # Specific key containing the username
            - name: POSTGRES_PASSWORD # Name of the environment variable for database password
              valueFrom: # Specifies the source of the environment value
                secretKeyRef: # References a key within a Secret resource
                  name: postgres-secret # Name of the Secret source
                  key: POSTGRES_PASSWORD # Specific key containing the password
          ports: # Ports exposed by the container
            - containerPort: 5432 # Port 5432 is exposed for Postgres traffic
          volumeMounts: # Storage volumes to mount inside the container filesystem
            - name: postgres-storage # Logical name of the volume to mount
              mountPath: /var/lib/postgresql/data # Directory where Postgres stores databases
      volumes: # Defines the storage volumes available to the Pod
        - name: postgres-storage # Logical name of the storage volume
          persistentVolumeClaim: # References a PersistentVolumeClaim for storage binding
            claimName: postgres-pvc # Name of the target PVC to bind
---
apiVersion: v1 # Specifies the Kubernetes API version for Service resources
kind: Service # Declares the resource type as a Service for network load balancing
metadata: # Contains metadata parameters for identifying the resource
  name: postgres # Unique name of the Service, used as DNS host name
spec: # Details the network configuration for the Service
  ports: # Ports exposed and routed by the Service
    - port: 5432 # Port exposed on the cluster-internal network
      targetPort: 5432 # Container port where traffic is forwarded
  selector: # Determines the set of Pods targeted by this Service
    app: postgres # Route traffic to Pods matching the 'postgres' label
