apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: shrihari7396/ai-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: ai-service-config
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-service-config
                  key: OLLAMA_BASE_URL
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: ai-service-config
                  key: SERVER_PORT
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  ports:
    - port: 8082
      targetPort: 8080
  selector:
    app: ai-service
