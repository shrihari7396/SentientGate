apiVersion: v1 # Specifies the Kubernetes API version for this resource
kind: ConfigMap # Declares the resource type as a ConfigMap for configuration data
metadata: # Contains metadata parameters for identifying the resource
  name: api-gateway-config # Unique name of the ConfigMap in the namespace
data: # Holds the configuration key-value pairs as plain text strings
  SPRING_DATA_REDIS_HOST: "redis" # Hostname parameter of the Redis server for session storage/caching
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka" # Eureka service discovery registry registration zone
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:29092" # Port/address details for Kafka message broker endpoints
  SERVER_PORT: "8080" # Listening network port for API Gateway HTTP traffic
