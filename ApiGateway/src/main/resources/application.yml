server:
  port: 8079

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@visitorKeyResolver}"

            - id: dummy-service
              uri: lb://DUMMY-SERVICE
              predicates:
                - Path=/api/dummy/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@visitorKeyResolver}"
            - id: LOGGING-SERVICE
              uri: lb://LOGGING-SERVICE
              predicates:
                - Path=/api/logs/**
              filters:
                - PrefixPath=/logging-service
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@visitorKeyResolver}"

            - id: MCP_SERVER
              uri: lb://MCP-SERVER
              predicates:
                - Path=/api/mcp/**
              filters:
                - PrefixPath=/mcp-service
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@visitorKeyResolver}"

            - id: AI_SERVICE
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/ai/**
              filters:
                - PrefixPath=/ai-service
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@visitorKeyResolver}"

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@visitorKeyResolver}"

            - id: after_route
              uri: lb://DUMMY-SERVICE
              predicates:
                - Path=/dummy/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@visitorKeyResolver}"


  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


    properties:
      spring.json.trusted.packages: "edu.pict.apigateway.kafkaEvent"


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true


sentinel:
  security:
    secret-key: asbdfhabsdfhnjsndjnjdsncnsadncaiusdhfiuwhe7ryh

jwt:
  secret-key: 

logging:
  level:
    kafka: debug
    redis: debug
