spring:
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      filter:
        request-rate-limiter:
          deny-empty-key: true
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@visitorKeyResolver}"

            - id: auth-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@visitorKeyResolver}"

            - id: after_route
              uri: lb://DUMMY-SERVICE
              predicates:
                - Path=/dummy/**
            - id: logging_service
              uri: lb://LOGGING-SERVICE
              predicates:
                - Path=/loggingService/**
#              order=100
#              predicates:
#                - Cookie=mycookie,mycookievalue
#            - id: user-service
#              uri: lb://DUMMYSERVICE
#              predicates:

#                - Path=/api/v1/inventory/**
#              filters:
#                - StripPrefix=2


  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


    properties:
      spring.json.trusted.packages: "edu.pict.apigateway.kafkaEvent"


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true


