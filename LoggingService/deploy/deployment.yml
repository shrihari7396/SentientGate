apiVersion: apps/v1 # Specifies the Kubernetes API version for Deployments
kind: Deployment # Declares the resource type as a Deployment
metadata: # Contains metadata parameters for identifying the resource
  name: logging-service # Unique name of the Deployment in the namespace
  labels: # Metadata tags used for grouping and identifying the resource
    app: logging-service # Label identifier for the application
spec: # Details the desired state and settings of the Deployment
  replicas: 1 # Specifies the number of concurrent Pod replicas to run
  selector: # Defines how the Deployment finds the Pods it manages
    matchLabels: # Lists label matching requirements for the target Pods
      app: logging-service # Match Pods containing the application label 'logging-service'
  template: # Templates the specification of Pods to be created
    metadata: # Contains metadata parameters for the Pod template
      labels: # Metadata tags applied to the created Pods
        app: logging-service # Label applied to Pods for grouping and selection
    spec: # Details the actual workload specification for the Pods
      containers: # Lists the containers running within the Pod
        - name: logging-service # Logical name of the container
          image: shrihari7396/logging-service:latest # Docker registry image path and version tag
          imagePullPolicy: IfNotPresent # Pull the image from registry only if it doesn't exist locally
          env: # Environment variables to inject into the container
            - name: SPRING_DATASOURCE_URL # Name of the environment variable for Postgres database connection URL
              valueFrom: # Specifies the source of the environment value
                configMapKeyRef: # References a key within a ConfigMap resource
                  name: logging-config # Name of the ConfigMap source
                  key: SPRING_DATASOURCE_URL # Specific key containing the connection URL
            - name: SPRING_DATASOURCE_USERNAME # Name of the environment variable for database username
              valueFrom: # Specifies the source of the environment value
                secretKeyRef: # References a key within a Secret resource
                  name: logging-secret # Name of the Secret source
                  key: SPRING_DATASOURCE_USERNAME # Specific key containing the username
            - name: SPRING_DATASOURCE_PASSWORD # Name of the environment variable for database password
              valueFrom: # Specifies the source of the environment value
                secretKeyRef: # References a key within a Secret resource
                  name: logging-secret # Name of the Secret source
                  key: SPRING_DATASOURCE_PASSWORD # Specific key containing the password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS # Name of the environment variable for Kafka servers
              valueFrom: # Specifies the source of the environment value
                configMapKeyRef: # References a key within a ConfigMap resource
                  name: logging-config # Name of the ConfigMap source
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS # Specific key containing Kafka connection detail
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE # Name of the environment variable for Eureka registry URL
              valueFrom: # Specifies the source of the environment value
                configMapKeyRef: # References a key within a ConfigMap resource
                  name: logging-config # Name of the ConfigMap source
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE # Specific key containing registry details
            - name: SERVER_PORT # Name of the environment variable for container HTTP port
              valueFrom: # Specifies the source of the environment value
                configMapKeyRef: # References a key within a ConfigMap resource
                  name: logging-config # Name of the ConfigMap source
                  key: SERVER_PORT # Specific key containing the port number
          ports: # Ports exposed by the container
            - name: http # Logical name for the HTTP port
              containerPort: 8080 # Port 8080 is exposed for HTTP REST API traffic
            - name: grpc # Logical name for the gRPC port
              containerPort: 9090 # Port 9090 is exposed for internal high-performance gRPC logging traffic
---
apiVersion: v1 # Specifies the Kubernetes API version for Service resources
kind: Service # Declares the resource type as a Service for network load balancing
metadata: # Contains metadata parameters for identifying the resource
  name: logging-service # Unique name of the Service, used as DNS host name
spec: # Details the network configuration for the Service
  ports: # Ports exposed and routed by the Service
    - name: http # Logical name for the HTTP port mapping
      port: 8080 # Port exposed on the cluster-internal network for HTTP requests
      targetPort: 8080 # Container port where HTTP traffic is forwarded
    - name: grpc # Logical name for the gRPC port mapping
      port: 9090 # Port exposed on the cluster-internal network for gRPC requests
      targetPort: 9090 # Container port where gRPC traffic is forwarded
  selector: # Determines the set of Pods targeted by this Service
    app: logging-service # Route traffic to Pods matching the 'logging-service' label
