apiVersion: v1 # Specifies the Kubernetes API version for this resource
kind: ConfigMap # Declares the resource type as a ConfigMap for configuration data
metadata: # Contains metadata parameters for identifying the resource
  name: kafka-config # Unique name of the ConfigMap in the namespace
data: # Holds the configuration key-value pairs as plain text strings
  KAFKA_BROKER_ID: "1" # Unique integer ID for the Kafka broker within the cluster
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181" # Connection string for Zookeeper coordination service
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092" # Port binding configurations for listeners
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-service:29092,PLAINTEXT_HOST://localhost:9092" # Listeners published to clients
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT" # Mapping security protocol to listener names
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT" # Name of listener used for broker communication
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1" # Replication factor for system offsets topic
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1" # Minimum in-sync replicas config for transactions
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1" # Replication factor for transaction state topic
