services:
  # Infrastructure
  postgres:
    image: postgres:16.2
    container_name: sentient-postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.4
    container_name: sentient-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sentient-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sentient-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # These are required to prevent Kraft mode error in 7.x
      # Though we are using Zookeeper, Confluent 7.5.0 image might check for these
      # Actually, just setting KAFKA_ZOOKEEPER_CONNECT should work if we DON'T set KAFKA_NODE_ID or KAFKA_PROCESS_ROLES.
      # The error "KAFKA_PROCESS_ROLES is not set" often happens if it thinks it's in Kraft mode.

      # Application Services
  eureka-server:
    image: shrihari7396/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_INSTANCE_HOSTNAME=eureka-server

  api-gateway:
    image: shrihari7396/api-gateway:latest
    deploy:
      replicas: 2
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - eureka-server
      - redis
      - kafka

  logging-service:
    image: shrihari7396/logging-service:latest
    container_name: logging-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
      - eureka-server
      - postgres
      - kafka

  mcp-server:
    image: shrihari7396/mcp-server:latest
    deploy:
      replicas: 2
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - GRPC_CLIENT_LOGGING_SERVICE_ADDRESS=discovery:///LOGGING-SERVICE
    depends_on:
      - eureka-server
      - redis
      - kafka

  ai-service:
    image: shrihari7396/ai-service:latest
    container_name: ai-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - eureka-server

  dummy-service:
    image: shrihari7396/dummy-service:latest
    container_name: dummy-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    depends_on:
      - eureka-server

  sentinel-ui:
    image: shrihari7396/sentinel-ui:latest
    container_name: sentinel-ui
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
