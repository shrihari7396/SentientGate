spring:
  application:
    name: ai-service
  output:
    ansi:
      enabled: always
  threads:
    virtual:
      enabled: true
  webflux:
    base-path: /ai-service

server:
  port: ${SERVER_PORT:8082}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:gemma3.2:latest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
