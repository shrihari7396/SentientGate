spring:
  application:
    name: ai-service

  output:
    ansi:
      enabled: always

  threads:
    virtual:
      enabled: true

server:
  port: 8082
  servlet:
    context-path: /api/aiService/


ollama:
  base-url: http://localhost:11434
  model: gemma3:latest    # or gemma3 if you prefer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
