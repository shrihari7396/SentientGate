name: Services Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh
          find . -name "*.sh" -exec chmod +x {} \;

      - name: Set up Infrastructure
        run: |
          cd scripts
          ./infrastructure.sh
          cd ..
          sleep 10

      - name: Run Tests
        run: ./scripts/test_local.sh
